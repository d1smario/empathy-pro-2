# Fly.io — rinominare `app` dopo `fly launch` oppure impostare `flyctl apps create empathy-garmin-ingest`.
# Secrets/env su Fly: stesse chiavi Supabase + Garmin + GARMIN_PUSH_PUBLIC_BASE_URL (origine pubblica ingest)
# + GARMIN_PULL_TRIGGER_URL + GARMIN_PULL_RUN_SECRET (allineati a Vercel).

app = "empathy-garmin-ingest"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.garmin-ingest"

[env]
  GARMIN_INGEST_PORT = "8790"
  GARMIN_INGEST_BODY_LIMIT_MB = "96"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
